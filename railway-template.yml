# Primus IDP - Railway Template
# Deploy with one click: https://railway.app/template/primus-idp

services:
  # PostgreSQL with pgvector
  postgres:
    image: ankane/pgvector:latest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${{POSTGRES_USER}}
      POSTGRES_PASSWORD: ${{POSTGRES_PASSWORD}}
      POSTGRES_DB: ${{POSTGRES_DB}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${{POSTGRES_USER}}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${{REDIS_PASSWORD}}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${{REDIS_PASSWORD}}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./primus_idp_backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${{POSTGRES_USER}}:${{POSTGRES_PASSWORD}}@postgres:5432/${{POSTGRES_DB}}
      CELERY_BROKER_URL: redis://:${{REDIS_PASSWORD}}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${{REDIS_PASSWORD}}@redis:6379/0
      SECRET_KEY: ${{SECRET_KEY}}
      OPENAI_API_KEY: ${{OPENAI_API_KEY}}
      EMBEDDING_MODEL: ${{EMBEDDING_MODEL}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres
      - redis

  # Celery Worker
  celery:
    build:
      context: ./primus_idp_backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://${{POSTGRES_USER}}:${{POSTGRES_PASSWORD}}@postgres:5432/${{POSTGRES_DB}}
      CELERY_BROKER_URL: redis://:${{REDIS_PASSWORD}}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${{REDIS_PASSWORD}}@redis:6379/0
      SECRET_KEY: ${{SECRET_KEY}}
      OPENAI_API_KEY: ${{OPENAI_API_KEY}}
    depends_on:
      - postgres
      - redis

  # Frontend
  frontend:
    build:
      context: ./primus_idp_web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FASTAPI_BACKEND_URL: ${{RAILWAY_PUBLIC_DOMAIN_BACKEND}}
    environment:
      NEXT_PUBLIC_FASTAPI_BACKEND_URL: ${{RAILWAY_PUBLIC_DOMAIN_BACKEND}}
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:

# Railway Variables Template
variables:
  POSTGRES_USER:
    default: primus
    description: PostgreSQL username
  POSTGRES_PASSWORD:
    generator: secret
    description: PostgreSQL password (auto-generated)
  POSTGRES_DB:
    default: primus_idp
    description: PostgreSQL database name
  REDIS_PASSWORD:
    generator: secret
    description: Redis password (auto-generated)
  SECRET_KEY:
    generator: secret
    description: Application secret key (auto-generated)
  OPENAI_API_KEY:
    description: OpenAI API key for LLM features
  EMBEDDING_MODEL:
    default: text-embedding-3-small
    description: Embedding model to use
