name: Deploy Primus IDP

on:
    push:
        branches:
            - main
            - V1-Primus-Hub
    workflow_dispatch:

env:
    RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install backend dependencies
              run: |
                  cd primus_idp_backend
                  pip install -e .

            - name: Run backend tests
              run: |
                  cd primus_idp_backend
                  python -c "from app.app import app; print('Backend OK')"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 9

            - name: Install frontend dependencies
              run: |
                  cd primus_idp_web
                  pnpm install --frozen-lockfile

            - name: Build frontend
              run: |
                  cd primus_idp_web
                  pnpm build
              env:
                  NEXT_PUBLIC_FASTAPI_BACKEND_URL: https://api.primusidp.net

    deploy-backend:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/V1-Primus-Hub'
        steps:
            - uses: actions/checkout@v4

            - name: Install Railway CLI
              run: npm install -g @railway/cli

            - name: Deploy Backend to Railway
              run: |
                  cd primus_idp_backend
                  railway up --service primus-backend
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    deploy-frontend:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/V1-Primus-Hub'
        steps:
            - uses: actions/checkout@v4

            - name: Install Railway CLI
              run: npm install -g @railway/cli

            - name: Deploy Frontend to Railway
              run: |
                  cd primus_idp_web
                  railway up --service primus-frontend
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    deploy-celery:
        needs: deploy-backend
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/V1-Primus-Hub'
        steps:
            - uses: actions/checkout@v4

            - name: Install Railway CLI
              run: npm install -g @railway/cli

            - name: Deploy Celery Worker to Railway
              run: |
                  cd primus_idp_backend
                  railway up --service primus-celery
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
